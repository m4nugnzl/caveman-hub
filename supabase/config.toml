# Configuración del CLI de Supabase.
#
# Solo contiene lo imprescindible para desplegar las Edge Functions. El resto de
# la configuración del proyecto (auth, base de datos, storage) se gestiona desde
# el panel: este repositorio no usa entorno local de Supabase.

project_id = "pscpermmojmircadirzk"

# ── notion-payments ─────────────────────────────────────────────────────────
#
# `verify_jwt = false` NO significa que la función sea pública, y merece la pena
# explicarlo porque parece lo contrario.
#
# Con `verify_jwt = true` (el valor por defecto) es la PASARELA de Supabase la que
# exige un JWT válido antes de dejar pasar la petición a la función. El problema
# es que el navegador manda primero una petición `OPTIONS` de comprobación
# (preflight), y **un preflight nunca lleva cabeceras personalizadas**: eso es
# justo su razón de ser. Así que la pasarela lo rechaza con un 401, el navegador ve
# un preflight fallido y la llamada real ni se intenta. El error que sale es un
# CORS confuso que no tiene nada que ver con CORS.
#
# Desactivándolo, la pasarela deja pasar el preflight —que la función responde con
# 200 y las cabeceras correctas— y **la autorización la hace la propia función**,
# que es más estricta que la pasarela:
#
#   1. Exige la cabecera `Authorization` y devuelve 401 sin ella.
#   2. Crea un cliente de Supabase CON ese JWT y lee la integración a través de
#      RLS. Si RLS no la devuelve, no es del que llama y responde 403.
#
# Es decir: la pasarela solo comprobaba que el token fuera válido; la función
# comprueba además que el recurso sea tuyo. No se pierde nada.
[functions.notion-payments]
verify_jwt = false

# ── review-link ─────────────────────────────────────────────────────────────
#
# Aquí `verify_jwt = false` no es un apaño de CORS: es el requisito. La página
# /r/<token> la abre el CLIENTE desde WhatsApp, sin sesión y puede que sin cuenta.
# Exigir un JWT haría imposible lo único que esta función existe para hacer.
#
# Lo que concede sin autenticar está acotado a propósito: canjear un token por una
# URL firmada de 30 minutos, y solo si el token existe y no está revocado. No lee
# nada más de la ficha del cliente que su nombre.
[functions.review-link]
verify_jwt = false

# Mismo criterio que notion-payments: la pasarela rechaza el preflight y la
# autorizacion la hace la funcion, comprobando ademas que la integracion sea tuya.
[functions.stripe-payments]
verify_jwt = false

# El webhook lo llama STRIPE, que no tiene sesión de Supabase. Y no puede tenerla:
# es un servidor ajeno. Lo que autentica cada peticion es la firma HMAC del propio
# evento, que la funcion comprueba antes de tocar nada.
[functions.stripe-webhook]
verify_jwt = false

# ── Facturación de la plataforma ────────────────────────────────────────────
#
# OJO: estas dos son de la cuenta de Stripe NUESTRA, la que cobra las
# suscripciones del hub. No confundir con las dos de arriba, que leen el Stripe
# de cada entrenador con una clave de solo lectura.

# El webhook del cobro: mismo caso que `stripe-webhook`. Lo llama Stripe y lo que
# autentica es la firma HMAC.
[functions.billing-webhook]
verify_jwt = false

# ── Aviso de ticket de soporte ──────────────────────────────────────────────
#
# Mismo caso que `notion-payments`: la llama el navegador con `functions.invoke`,
# así que el preflight `OPTIONS` llega sin cabeceras y la pasarela lo rechazaría.
# La autorización la hace la función, y es más estricta que la pasarela: lee el
# ticket CON EL TOKEN de quien llama, así que RLS decide si es suyo. Sin eso,
# mandar el identificador de otro ticket enviaría su contenido por correo.
[functions.support-notify]
verify_jwt = false

# Y esta también, aunque parezca lo contrario: la llama el NAVEGADOR con sesión.
#
# El motivo es el del comentario de `notion-payments`: `functions.invoke` manda
# cabecera `Authorization` y `Content-Type: application/json`, así que el navegador
# hace primero un preflight `OPTIONS` —que por definición no lleva cabeceras
# propias—. Con `verify_jwt = true` la pasarela lo rechaza con un 401 y la llamada
# real ni se intenta; lo que ve el usuario es un error de CORS que no habla de lo
# que pasa.
#
# La autorización la hace la función, y comprueba más que la pasarela: exige la
# cabecera, verifica el token contra Auth, y además que quien llama sea el DUEÑO
# del equipo. La pasarela solo miraba que el token fuera válido.
[functions.billing-checkout]
verify_jwt = false

# ── El calendario del cliente ───────────────────────────────────────────────
#
# Aquí `verify_jwt = false` es el REQUISITO, como en `review-link`, y no el apaño
# del preflight que explican las demás.
#
# Quien pide este feed no es el navegador del cliente: son los servidores de
# Google, Apple u Outlook, que consultan la URL suscrita por su cuenta y **no
# pueden añadir ninguna cabecera**. Ni sesión, ni `apikey`. Con la pasarela
# exigiendo un JWT, suscribir el calendario sería imposible.
#
# Lo que concede sin autenticar está acotado igual que en `review-link`: un token
# opaco de la URL da los eventos de UN cliente dentro de una ventana de fechas, y
# solo si no está revocado. Ni su email, ni sus pesos, ni nada más de su ficha.
[functions.client-calendar]
verify_jwt = false

# ── El bot de la radiografía ────────────────────────────────────────────────
#
# También REQUISITO, y por partida doble: esta función tiene dos llamadores y
# **ninguno de los dos puede traer un JWT de Supabase**.
#
#   · El Cron Trigger del worker (`?empujar`), que se identifica con
#     `RADIOGRAFIA_CRON_SECRET` en la cabecera `Authorization`. No hay usuario
#     detrás de un cron, así que no hay sesión que mandar.
#   · Telegram, que llama al webhook con su propia cabecera
#     `X-Telegram-Bot-Api-Secret-Token`. Sus servidores no saben nada de
#     Supabase y no se les puede pedir que añadan nada.
#
# Con la pasarela exigiendo un JWT, los dos se llevan un 401 antes de que la
# función llegue a correr, y el bot no funciona en absoluto.
#
# Lo que concede sin pasarela está cerrado por triplicado DENTRO de la función,
# que es donde tiene que estar: el secreto del cron para el empujón, el secreto
# del webhook para lo que dice venir de Telegram, y una lista blanca de
# `chat_id` para quien pregunta. A cualquier otro, silencio — un mensaje de
# error confirmaría que el bot existe y a qué responde.
#
# `radiografia` NO lleva sección, y es deliberado: la llama el navegador con
# `functions.invoke`, que sí manda la sesión, y la pasarela ya deja pasar el
# preflight sin autenticar (comprobado: `OPTIONS` contesta 204). Así que ahí la
# comprobación del gateway se queda puesta, DELANTE de la que hace la propia
# función contra `platform_admins`. Es el endpoint que entrega el estado de
# seguridad de la base: es el último sitio donde quitar una capa.
[functions.telegram]
verify_jwt = false

# ── Entorno local ───────────────────────────────────────────────────────────
#
# El `seed` apunta a `bootstrap.sql`, que no es una semilla de datos sino el
# disparador `handle_new_user`: el que crea la fila de `profiles` al registrarse.
#
# ── Por qué aquí y no como una migración más ────────────────────────────────
# Porque en el proyecto que está en marcha ese disparador YA EXISTE, escrito a
# mano, y no se puede leer desde el repositorio. Una migración lo sustituiría por
# la reconstrucción de `bootstrap.sql` sin poder comparar antes — que es
# exactamente contra lo que avisa la 0019. El `seed` solo corre en local y al
# reiniciar la base de pruebas, nunca en producción.
#
# Con esto, `npx supabase start` levanta una instalación COMPLETA desde cero:
# tablas (migración 0000), el resto de migraciones, y el disparador del alta.
[db.seed]
enabled = true
sql_paths = ["./bootstrap.sql"]
