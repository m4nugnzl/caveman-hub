<!DOCTYPE html>
<!--
  `data-theme="light"` escrito aquí, antes de que arranque nada: el PAPEL es el
  tema por defecto del producto y este atributo es lo que evita el destello del
  primer pintado. `ThemeProvider` lo reescribe en cuanto monta —y lo cambia a
  noche si el usuario la eligió— pero entre el HTML y ese momento la página ya
  se pinta del tema correcto.

  ══ Por qué el papel y no la noche (11 sep 2026) ═══════════════════════════
  Durante meses arrancaba en noche «porque la noche es la identidad». La
  consecuencia medida: todo el trabajo de acabado se hizo en el tema que casi
  nadie veía. El papel templado, las sombras teñidas con la tinta del papel, el
  secundario a 7,8:1 — todo eso vive en claro. El hierro se quedó en un negro
  azulado con acento cobalto, que es literalmente el default estético que
  `CLAUDE.md` §25.2 manda evitar.

  Y el argumento de fondo: esto es una herramienta de trabajo de jornada
  completa. El entrenador la tiene abierta a las once de la mañana con luz de
  ventana, programando bloques y leyendo cifras. Linear, Stripe y Notion
  arrancan en claro por lo mismo y ninguno pierde por ello su carácter: el
  carácter lo lleva la estructura y la letra, no la falta de luz.

  La noche no se retira — pasa a ser lo que debía haber sido siempre: una
  preferencia bien hecha en Ajustes → Apariencia, que se recuerda. Lo que se
  acaba es que el producto fuera dos productos distintos según la hora.
-->
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Dos, con media query, y no una: el color de la barra del navegador debe
      seguir al tema del sistema. Con uno solo (el lienzo oscuro), quien usaba
      el tema claro veía una franja negra sobre una app blanca — y además
      discrepaba del `theme_color` del manifest.
    -->
    <!--
      La PRIMERA va sin `media` y lleva el papel: es la que gana mientras
      `ThemeProvider` no ha montado, y el tema por defecto es el claro. Sin
      ella, quien tuviera el sistema en oscuro veía una franja negra sobre una
      aplicación de papel durante el primer pintado. La segunda sigue ahí para
      quien tiene el sistema en oscuro Y no ha elegido todavía: no cambia el
      tema de la página —eso lo decide el atributo de arriba— pero evita el
      salto de color de la barra en ese caso. El valor real lo reescribe
      `ThemeProvider` leyendo `--canvas` en cuanto sabe qué tema toca.
    -->
    <meta name="theme-color" content="#f7f6f2" />
    <meta name="theme-color" content="#0d1014" media="(prefers-color-scheme: dark)" />
    <!--
      Las dos: `mobile-web-app-capable` es la estándar y la que piden ahora los
      navegadores —Chrome avisa por consola de que la de Apple está obsoleta— y la
      de Apple sigue haciendo falta para que Safari en iOS abra la aplicación a
      pantalla completa cuando el cliente la añade a su pantalla de inicio, que es
      como la va a usar en el gimnasio.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Caveman" />
    <!--
      El título dice la CATEGORÍA, no una frase de campaña.

      Quien busca esto no escribe «el entrenamiento de tus clientes en un sitio»:
      escribe «software para entrenadores online», y ese era el término que no
      aparecía en ninguna parte del documento. La portada lo repite como rótulo
      sobre el titular, que es donde se comprueba que la página trata de lo que
      el título promete.

      Y sirve además como nombre de pestaña estando dentro, que es el otro uso
      que tiene: corto, sin adjetivos y reconocible entre veinte pestañas.
    -->
    <title>Caveman Hub — software para entrenadores online</title>

    <!--
      ══ Lo que hacía falta para poder instalarla y para poder compartirla ═══

      Aquí se declaraba `mobile-web-app-capable` desde el principio, o sea «esto
      se puede añadir a la pantalla de inicio», y no había ni manifest ni icono
      de inicio. La consecuencia era justo la del caso de uso que el propio
      código describe —el cliente que abre esto en el gimnasio y se la guarda en
      la pantalla de inicio—: al añadirla, el icono era una CAPTURA de la página
      y el nombre lo que decidiera el navegador.

      `apple-touch-icon` tiene que ser PNG: Safari en iOS no admite SVG ahí, y es
      el único sitio donde el vectorial no vale. Los tres los genera
      `scripts/generar-iconos.mjs` a partir de la misma geometría de la marca,
      para que no se queden viejos.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <!--
      ══ Y esto es lo que se ve al pegar el enlace ══════════════════════════

      WhatsApp es EL canal de este producto: por ahí va la invitación del cliente
      y por ahí se comparte la revisión en vídeo. Sin descripción ni imagen, esos
      enlaces se pegaban desnudos —una línea de texto azul—, que es exactamente
      como se ve un enlace en el que nadie pincha.

      `og:url` se deja fuera a propósito: es absoluta por definición y aquí el
      dominio no se conoce en tiempo de build. Sin ella, los rastreadores usan la
      URL que están leyendo, que es la correcta.

      La imagen la compone `scripts/generar-og.mjs` —titular, rótulo y las dos
      pantallas del héroe, con la Archivo y las capturas del propio proyecto—.
      Si cambia el titular de la portada, ese script cambia con él: son la misma
      promesa a dos tamaños. Las medidas de aquí abajo tienen que ser las que
      imprime al terminar.
    -->
    <meta
      name="description"
      content="Programa rutinas y dietas, compara fotos de progreso a la misma escala y contesta el check-in de cada semana. Tus clientes apuntan lo que levantan desde el móvil, sin descargar ninguna app. Prueba 14 días sin tarjeta."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Caveman Hub" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Caveman Hub — software para entrenadores online" />
    <meta
      property="og:description"
      content="Programa rutinas y dietas, sigue medidas y fotos de progreso, y contesta el check-in de cada semana. Tus clientes lo llevan en el móvil."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Caveman Hub: la primera app para entrenadores de verdad. El inicio del entrenador en el ordenador, con las revisiones pendientes y lo que ha hecho cada cliente, y al lado la sesión del día en el móvil de uno de ellos."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      ══ Datos estructurados, y solo los que no viven en otro sitio ═════════

      Le dice al buscador QUÉ es esto —una aplicación de negocio, en castellano,
      que se usa en el navegador—, que es justo lo que no se puede deducir de una
      página que se pinta con JavaScript.

      No lleva precios NI las preguntas frecuentes, y es deliberado: los precios
      son de `plan_limits` y las preguntas son del componente de la portada.
      Copiarlos aquí sería tenerlos en dos sitios, o sea tenerlos mal en uno de
      los dos el día que cambien — y un dato estructurado que contradice a la
      página es peor que no tenerlo, porque el buscador se queda con el viejo.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Caveman Hub",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "inLanguage": "es-ES",
        "description": "Software para entrenadores personales online: programación de rutinas, nutrición, antropometría, comparación de fotos de progreso y revisión semanal."
      }
    </script>
    <!--
      La tipografía de titulares y cifras (Archivo) va AUTOALOJADA, no en Google
      Fonts: sin petición a terceros, sin dependencia de que nadie mueva un
      archivo, y sin el bloqueo del primer render que motivó quitar la fuente
      externa en su día. El `preload` la pide en paralelo con el CSS en vez de
      esperar a que el navegador descubra el @font-face dentro de la hoja.

      `crossorigin` es obligatorio aunque el archivo sea del mismo origen: las
      fuentes se piden siempre en modo CORS, y sin el atributo el navegador
      descarga el archivo DOS veces —una por el preload y otra por el @font-face.
    -->
    <link
      rel="preload"
      href="/fonts/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      El favicon es el mismo mark de la aplicación (tres barras ascendentes, la
      última cargada con el disco de 25), en línea como data URI: sin petición
      extra y sin archivo binario que mantener sincronizado con el componente.
      Sus tintas son las mismas que las de `LogoMark` —hierro, tiza y el rojo del
      disco—, así que si una cambia hay que cambiar la otra.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='8' fill='%2314181c'/%3E%3Cg fill='%23e8ecf1'%3E%3Crect x='7' y='18' width='5' height='11' rx='1.5'/%3E%3Crect x='14.5' y='12' width='5' height='17' rx='1.5'/%3E%3Crect x='22' y='5' width='5' height='24' rx='1.5'/%3E%3C/g%3E%3Crect x='22' y='5' width='5' height='3.5' rx='1.5' fill='%23e2564a'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
