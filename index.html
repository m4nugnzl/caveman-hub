<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      El tema por defecto es CLARO y `ThemeProvider` escribe `data-theme` en
      cuanto arranca. Declarar aquí `color-scheme: dark` —como estaba— pintaba de
      oscuro los controles nativos, los desplegables y la barra de scroll sobre
      una interfaz clara. `light dark` deja que el navegador siga al tema real.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eceef1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Caveman Hub</title>
    <!--
      La tipografía de titulares y cifras (Archivo) va AUTOALOJADA, no en Google
      Fonts: sin petición a terceros, sin dependencia de que nadie mueva un
      archivo, y sin el bloqueo del primer render que motivó quitar la fuente
      externa en su día. El `preload` la pide en paralelo con el CSS en vez de
      esperar a que el navegador descubra el @font-face dentro de la hoja.

      `crossorigin` es obligatorio aunque el archivo sea del mismo origen: las
      fuentes se piden siempre en modo CORS, y sin el atributo el navegador
      descarga el archivo DOS veces —una por el preload y otra por el @font-face.
    -->
    <link
      rel="preload"
      href="/fonts/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      El favicon es el mismo mark de la aplicación (tres barras ascendentes, la
      última cargada con el disco de 25), en línea como data URI: sin petición
      extra y sin archivo binario que mantener sincronizado con el componente.
      Sus tintas son las mismas que las de `LogoMark` —hierro, tiza y el rojo del
      disco—, así que si una cambia hay que cambiar la otra.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='8' fill='%2314181c'/%3E%3Cg fill='%23e8ecf1'%3E%3Crect x='7' y='18' width='5' height='11' rx='1.5'/%3E%3Crect x='14.5' y='12' width='5' height='17' rx='1.5'/%3E%3Crect x='22' y='5' width='5' height='24' rx='1.5'/%3E%3C/g%3E%3Crect x='22' y='5' width='5' height='3.5' rx='1.5' fill='%23e2564a'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
